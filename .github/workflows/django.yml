name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.9'
            common_constraints: common-py39.txt
            constraints: django-legacy.txt
          - os: ubuntu-24.04
            python-version: '3.11'
            common_constraints: common.txt
            constraints: django-lts.txt
          - os: ubuntu-24.04
            python-version: '3.14'
            common_constraints: common.txt
            constraints: django-lts.txt
          - os: ubuntu-24.04
            python-version: '3.12'
            common_constraints: common.txt
            constraints: django-current.txt
          - os: ubuntu-latest
            python-version: '3.15'
            common_constraints: common.txt
            constraints: django-current.txt

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-devel.txt -c .github/constraints/${{ matrix.common_constraints }} -c .github/constraints/${{ matrix.constraints }}
    - name: Run Tests
      run: |
        coverage run --source='dtf' --omit='*tests*,*migrations*,*wsgi*,*asgi*' manage.py test -v2
    - name: Publish coverage report to coveralls
      uses: AndreMiras/coveralls-python-action@v20201129
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        flag-name: python-${{ matrix.python-version }}
